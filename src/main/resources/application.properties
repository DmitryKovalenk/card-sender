spring.application.name=card-sender

# Oracle connection and Flyway-managed initialization
spring.datasource.url=${DATABASE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
# Такого ви не побачити на тесті чи прод конфігах, бо там будуть секрети.
spring.datasource.username=${DATABASE_USERNAME:card_sender}
spring.datasource.password=${DATABASE_PASSWORD:card_sender}
spring.sql.init.mode=never

# Flyway owns DDL; JPA validates mappings and closes persistence contexts at service boundaries.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-migration-naming=true

# Swagger UI
springdoc.paths-to-match=/api/**,/demo/**
springdoc.swagger-ui.tags-sorter=alpha

# Delivery credentials; transport defaults live in NovaPoshtaProperties
nova-poshta.enabled=${NOVA_POSHTA_ENABLED:true}
nova-poshta.api-key=${NOVA_POSHTA_API_KEY:c06f01063c135dae77ba74e7b115f54a}
nova-poshta.sender=${NOVA_POSHTA_SENDER:21a3d100-e12c-11ea-8513-b88303659df5}
nova-poshta.city-sender=${NOVA_POSHTA_CITY_SENDER:db5c88f0-391c-11dd-90d9-001a92567626}
nova-poshta.sender-warehouse-index=${NOVA_POSHTA_SENDER_WAREHOUSE_INDEX:31/2}
nova-poshta.contact-sender=${NOVA_POSHTA_CONTACT_SENDER:30d2292a-a359-11ee-a60f-48df37b921db}
nova-poshta.senders-phone=${NOVA_POSHTA_SENDERS_PHONE:380676446969}
