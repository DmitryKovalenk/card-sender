services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: card-sender-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: card_sender
      APP_USER_PASSWORD: card_sender
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  oracle-data:
  cloudbeaver-data:
